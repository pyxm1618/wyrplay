      <text x="820" y="220" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#f59e0b">Haha!</text>
      <text x="960" y="210" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#3b82f6">♪</text>
