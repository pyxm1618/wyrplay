name: Prettier Preview

on:
  push:
    branches:
      - fix/status-boundary-coverage

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --config .prettierrc.json src/app/global-error.tsx
