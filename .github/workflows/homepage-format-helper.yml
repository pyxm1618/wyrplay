name: Homepage format helper

on:
  push:
    branches:
      - fix/homepage-lower-page-restoration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-lower-page-restoration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format scoped files
        run: |
          bunx prettier@3.7.4 --write             src/modules/would-you-rather/ui/illustrated-home.css             src/modules/would-you-rather/ui/illustrated-home.tsx             tests/e2e/homepage.spec.ts
      - name: Remove one-off helper and commit formatting
        run: |
          git rm .github/workflows/homepage-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/would-you-rather/ui/illustrated-home.css             src/modules/would-you-rather/ui/illustrated-home.tsx             tests/e2e/homepage.spec.ts
          git diff --cached --check
          git commit -m "style(home): apply repository formatting"
          git push origin HEAD:fix/homepage-lower-page-restoration
