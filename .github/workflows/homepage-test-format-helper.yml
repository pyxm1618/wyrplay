name: Homepage test format helper

on:
  push:
    branches:
      - fix/homepage-lower-page-restoration

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/homepage-lower-page-restoration
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format scoped tests
        run: |
          bunx prettier@3.7.4 --write \
            tests/e2e/homepage.spec.ts \
            tests/e2e/presentation-boundaries.spec.ts \
            tests/e2e/reviewed-finder-navigation.spec.ts \
            tests/e2e/route-link-audit.spec.ts \
            tests/e2e/voting-ownership.spec.ts \
            tests/e2e/wyrplay-interactions.spec.ts \
      - name: Remove one-off helper and commit formatting
        run: |
          git rm .github/workflows/homepage-test-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/homepage.spec.ts \
            tests/e2e/presentation-boundaries.spec.ts \
            tests/e2e/reviewed-finder-navigation.spec.ts \
            tests/e2e/route-link-audit.spec.ts \
            tests/e2e/voting-ownership.spec.ts \
            tests/e2e/wyrplay-interactions.spec.ts
          git diff --cached --check
          git commit -m "style(home): format updated e2e contracts"
          git push origin HEAD:fix/homepage-lower-page-restoration
