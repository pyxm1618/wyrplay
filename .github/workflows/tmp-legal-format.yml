name: Temporary legal format preview

on:
  push:
    branches:
      - legal-content-us-overhaul

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          bunx prettier --write "src/app/(legal)/contact/page.tsx" "src/config/legal.config.ts"
          git diff -- "src/app/(legal)/contact/page.tsx" "src/config/legal.config.ts"
