name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: wyrplay-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_test
      BETTER_AUTH_SECRET: schema-generation-secret-with-at-least-32-characters
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Better Auth schema generation
        run: |
          bunx auth@1.7.15 generate --config src/platform/auth/auth-cli.ts --output /tmp/auth-schema.ts --yes
          bunx prettier --config .prettierrc.json --write /tmp/auth-schema.ts
          diff -u src/platform/database/auth-schema.ts /tmp/auth-schema.ts
      - name: Formatting
        run: bun run format:check
      - name: Diff whitespace check
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [ -z "$base_sha" ] || [ -z "$head_sha" ] || [ "$base_sha" = "$zero_sha" ]; then
            echo "::notice::No stable comparison SHA is available for this event; skipping diff whitespace check."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"
          git diff --check "$base_sha" "$head_sha"
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test:unit
      - name: Webhook purge concurrency
        run: bun run test:integration -- tests/integration/commerce/webhook-purge-concurrency.test.ts
      - name: Webhook log redaction
        run: bun run test:integration -- tests/integration/commerce/webhook-log-redaction.test.ts
      - name: Job lease concurrency
        run: bun run test:integration -- tests/integration/commerce/job-leases.test.ts
      - name: Operational health and retention alerts
        run: bun run test:integration -- tests/integration/operations/health-alerts.test.ts
      - name: PostgreSQL integration tests
        run: bun run test:integration
      - name: Credit expiry race verification (30 runs)
        run: bun run verify:credit-races
      - name: Isolated database restore drill
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:16-alpine --format '{{.ID}}' | head -n 1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" dropdb -U postgres --if-exists creat_web_restore_source
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres creat_web_restore_source
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/creat_web_restore_source bun run db:migrate
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d creat_web_restore_source -Fc > /tmp/creat-web.dump
          docker exec "$POSTGRES_CONTAINER" dropdb -U postgres --if-exists creat_web_restore
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres creat_web_restore
          cat /tmp/creat-web.dump | docker exec -i "$POSTGRES_CONTAINER" pg_restore -U postgres -d creat_web_restore --no-owner --no-acl
          RESTORED_DATABASE_URL=postgres://postgres:postgres@localhost:5432/creat_web_restore bun scripts/verify-restored-database.ts
          rm -f /tmp/creat-web.dump
      - name: Provider contract tests
        run: bun run test:contract
      - name: Migration verification
        run: bun run db:verify
      - name: Architecture boundaries
        run: bun run verify:architecture
      - name: Repository secret scan
        run: bun run verify:secrets
      - name: SEO verification
        run: bun run verify:seo
      - name: i18n verification
        run: bun run verify:i18n
      - name: Security verification
        run: bun run verify:security
      - name: Subscription verification
        run: bun run verify:subscription
      - name: Commerce verification
        run: bun run verify:commerce
      - name: Credit verification
        run: bun run verify:credits
      - name: Supply-chain audit
        run: bun run verify:supply-chain
      - name: Optional-provider build matrix
        run: bun run test:build-matrix
      - name: Production application build
        run: bun run build
      - name: Release verification
        run: bun run verify:release --mode=test

  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Real-page performance budgets
        run: bun run verify:performance

  browser:
    name: Browser regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser regression tests
        run: bun run test:browser

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_e2e
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_e2e
      BETTER_AUTH_SECRET: e2e-better-auth-secret-with-at-least-32-characters
      EMAIL_TRANSPORT: test
      TEST_EMAIL_DIR: /tmp/creat-web-test-emails
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Prepare database and mailbox
        run: |
          rm -rf "$TEST_EMAIL_DIR"
          bun run db:migrate
      - name: Browser end-to-end tests
        run: bun run test:e2e
      - name: Upload responsive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-responsive-evidence
          path: |
            test-results/**/*.png
            test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 14
      - name: Production-mode canonical and security output
        run: bun run verify:seo:production

  clean-setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: creat_web_clean
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d creat_web_clean"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CLEAN_SETUP_DATABASE_URL: postgres://postgres:postgres@localhost:5432/creat_web_clean
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install harness dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium prerequisite
        run: bunx playwright install --with-deps chromium
      - name: Verify independent clean setup
        run: bun scripts/verify-clean-setup.ts

  cloudflare-build:
    name: Cloudflare Production Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      GA4_MEASUREMENT_ID: G-MZM90QN1VJ
      CLARITY_PROJECT_ID: yywwognjg1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build for Cloudflare
        run: bun run build:cloudflare
      - name: Verify Hyperdrive platform proxy
        run: |
          bun -e 'import { getPlatformProxy } from "wrangler"; const proxy = await getPlatformProxy({ envFiles: [] }); await proxy.dispose();'

  deploy:
    name: Production Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, performance, browser, e2e, clean-setup]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GA4_MEASUREMENT_ID: G-MZM90QN1VJ
      CLARITY_PROJECT_ID: yywwognjg1
    steps:
      - uses: actions/checkout@v4
      - name: Determine deployment freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          remote_main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main_sha"
          if [ "$GITHUB_SHA" != "$remote_main_sha" ]; then
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded deployment: workflow SHA $GITHUB_SHA is no longer current main $remote_main_sha"
            echo "Superseded by current main `$remote_main_sha`; production deployment skipped safely." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.freshness.outputs.current == 'true'
        with: { bun-version: 1.4.4 }
      - name: Install dependencies
        if: steps.freshness.outputs.current == 'true'
        run: bun install --frozen-lockfile
      - name: Build for Cloudflare
        if: steps.freshness.outputs.current == 'true'
        run: bun run build:cloudflare
      - name: Deploy to Production
        if: steps.freshness.outputs.current == 'true'
        run: bun run deploy:cloudflare
