name: Refresh sharp lockfile

on:
  push:
    branches:
      - security/sharp-0.35.5

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/sharp-0.35.5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate lockfile
        run: bun install --lockfile-only

      - name: Verify advisory is cleared
        run: bun audit --registry https://registry.npmjs.org --audit-level=high --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Commit regenerated lockfile and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git rm .github/workflows/refresh-sharp-lock.yml
          git commit -m "fix(security): refresh lockfile for sharp 0.35.5"
          git push origin HEAD:security/sharp-0.35.5
