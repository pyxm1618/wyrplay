name: Temporary COPPA format preview

on:
  push:
    branches:
      - legal-coppa-closeout

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Show Prettier diff
        run: |
          bunx prettier --write "src/app/api/wyr/kids-vote/route.ts" "src/modules/would-you-rather/ui/duel-arena.tsx"
          git diff -- "src/app/api/wyr/kids-vote/route.ts" "src/modules/would-you-rather/ui/duel-arena.tsx"
